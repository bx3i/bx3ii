<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BX3I | Official Links</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: linear-gradient(rgba(5, 2, 2, 0.8), rgba(11, 5, 5, 0.9)), 
                        url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            text-align: center;
            background: rgba(18, 5, 5, 0.75);
            border: 1px solid rgba(189, 29, 29, 0.4);
            border-radius: 20px;
            padding: 40px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 20px rgba(189, 29, 29, 0.2);
            backdrop-filter: blur(12px);
        }

        .profile-img-container {
            width: 130px;
            height: 130px;
            margin: 0 auto 20px;
            border-radius: 50%;
            border: 3px solid #bd1d1d;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(189, 29, 29, 0.6);
        }

        .profile-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 8px;
            color: #fff;
            text-shadow: 0 2px 10px rgba(189, 29, 29, 0.8);
        }

        p.bio {
            color: #cccccc;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, rgba(26, 8, 8, 0.9) 0%, rgba(43, 12, 12, 0.9) 100%);
            border: 1px solid rgba(189, 29, 29, 0.5);
            padding: 14px 20px;
            border-radius: 12px;
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .link-btn:hover {
            background: linear-gradient(135deg, rgba(43, 12, 12, 1) 0%, rgba(66, 18, 18, 1) 100%);
            border-color: #ff3333;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(189, 29, 29, 0.5);
        }

        .link-btn .icon-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .link-btn i {
            font-size: 20px;
            color: #ff3333;
        }

        .footer {
            margin-top: 35px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-img-container">
            <img src="avatar.jpg" alt="BY 3I Profile">
        </div>

        <h1>BX3I</h1>
        <p class="bio">Gaming & Content Creator</p>

        <div class="links-list">
            <a href="https://www.youtube.com/@bx3ii" target="_blank" class="link-btn">
                <div class="icon-title">
                    <i class="fa-brands fa-youtube"></i>
                    <span>قناتي على يوتيوب</span>
                </div>
                <i class="fa-solid fa-arrow-left" style="font-size: 12px; color: #888;"></i>
            </a>
        </div>

        <div class="footer">
            &copy; 2026 BX3I. All Rights Reserved.
        </div>
    </div>

</body>
</html>
